name: Validate HSdeck unified Boomsday card history
on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'cards.json'
      - '.github/workflows/validate-boom-history.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hsdeck-boomsday-date-v1
  cancel-in-progress: false
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read immutable migration converter
        run: |
          curl -fsSL --retry 3 'https://raw.githubusercontent.com/qxwd565/legacy/c7622bd48972ff3b79f095533e6bdb4ffcc01cf0/tools/flatten-date-sources.py' -o /tmp/flatten-dates-v1.py
      - name: Convert and verify 155 card histories
        run: |
          python /tmp/flatten-dates-v1.py --root . --strict
          python /tmp/flatten-dates-v1.py --root . --strict --check
          git diff --check
      - name: Commit only date-keyed card documents
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- data/
          if ! git diff --cached --quiet; then
            git commit -m 'Unify Boomsday card history as public dates-v1 [skip ci]'
            git push origin HEAD:main
          fi
